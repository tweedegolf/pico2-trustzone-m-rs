[package]
name = "app-s"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
panic-semihosting = "0.6.0"
rp235x-hal = "0.4.0"
embedded-hal = "1.0.0"

# this lets you use `cargo fix`!
[[bin]]
name = "app-s"
test = false
bench = false
